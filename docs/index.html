/* ===== 基本 ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);min-height:100vh}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.zh{font-family:var(--f-zh);color:var(--muted);font-size:.86em;font-weight:400}
body.no-zh .zh{display:none!important}
.zhb{display:block;margin-top:2px}
.mono{font-family:var(--f-mono)}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px}

/* ===== 頂部 ===== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0;margin-right:auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:.01em;text-transform:uppercase}
.brand b span{color:var(--signal)}
.brand small{font-family:var(--f-zh);font-size:.72rem;color:var(--muted);margin-top:3px}
.xp{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:.78rem;white-space:nowrap}
.xp .medal{width:24px;height:24px;border-radius:50%;background:var(--brass);color:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem}
.xp .bar{width:54px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.xp .bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .5s}
.xp .rank{font-weight:700}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:.9rem;font-weight:700;flex:none}
.iconbtn[aria-pressed="false"]{opacity:.45}
.iconbtn svg{width:18px;height:18px}
@media (max-width:520px){.xp .bar,.xp .rank-zh{display:none}.brand small{display:none}}

.zones{display:flex;gap:6px;padding-block:10px 4px}
.zones button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700}
.zones button .zh{font-size:.75rem}
.zones button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zones button[aria-selected="true"] .zh{color:color-mix(in srgb,var(--bg) 75%,transparent)}
main{padding-block:12px 64px}

/* ===== 按鈕 ===== */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1220}}
.btn.ghost{background:transparent}
.btn.primary .zh,.hero .btn .zh{color:inherit;opacity:.75}
.btn.big{font-size:1.05rem;padding:12px 20px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* ===== 卡 ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h-display{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.lead{font-size:1.05rem}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:18px}
.note{font-size:.84rem;color:var(--muted)}
.warn{font-size:.82rem;background:var(--brass-soft);border-left:3px solid var(--brass);padding:6px 10px;border-radius:6px;font-family:var(--f-zh)}
.stamp{display:inline-block;font-family:var(--f-mono);font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:2.5px solid currentColor;padding:2px 10px;border-radius:4px;transform:rotate(-4deg);color:var(--signal)}
.stamp.pop{animation:stampIn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:rotate(-4deg) scale(2.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}

/* ===== 溫習主頁：路線圖 ===== */
.hero{display:grid;gap:14px;padding:20px;border-radius:16px;background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
.hero .zh{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.hero h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(2.1rem,7vw,3.4rem);line-height:.9}
.hero h1 em{font-style:normal;color:var(--signal)}
.hero .years{position:absolute;right:-6px;bottom:-18px;font-family:var(--f-display);font-weight:800;font-size:6.5rem;opacity:.09;line-height:1;pointer-events:none}
.hero .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem}
.hero-stats b{font-family:var(--f-display);font-size:1.6rem;display:block;line-height:1}

.route{position:relative;display:flex;flex-direction:column;gap:12px;margin-top:18px;padding-left:34px}
.route::before{content:"";position:absolute;left:13px;top:10px;bottom:10px;width:4px;border-radius:4px;background:repeating-linear-gradient(var(--line) 0 10px,transparent 10px 16px)}
.station{position:relative;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .15s}
.station:hover{transform:translateX(3px);border-color:var(--accent)}
.station::before{content:"";position:absolute;left:-29px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
.station.done::before{background:var(--ok);border-color:var(--ok)}
.station.next::before{border-color:var(--accent);animation:pulse 1.6s infinite}
.station .num{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.station h3{font-family:var(--f-display);font-weight:800;font-size:1.35rem;text-transform:uppercase;line-height:1.05}
.station .meta{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.stars{color:var(--line);letter-spacing:2px;font-size:1.05rem}
.stars .on{color:var(--brass)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.badge{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;border:1px dashed var(--line);font-size:.8rem;color:var(--muted)}
.badge i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-style:normal;font-family:var(--f-display);font-weight:800}
.badge.got{border-style:solid;border-color:var(--brass);color:var(--ink);background:var(--brass-soft)}
.badge.got i{background:var(--brass);color:var(--surface)}

/* ===== 章節 ===== */
.chap-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chap-head .t{min-width:0;flex:1}
.chap-head h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;line-height:1}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.dots i{width:22px;height:5px;border-radius:5px;background:var(--line)}
.dots i.seen{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.dots i.cur{background:var(--accent)}
.scene{animation:sceneIn .3s ease-out}
@keyframes sceneIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.scene h3.st{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,5vw,2.2rem);text-transform:uppercase;line-height:.95}
.scene-foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.hint{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);display:flex;align-items:center;gap:6px}
.hint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}

/* 翻牌 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{perspective:900px;min-height:150px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.tile .in{display:grid;width:100%;min-height:150px;transition:transform .45s;transform-style:preserve-3d}
.tile.open .in{transform:rotateY(180deg)}
.tile .face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);overflow:auto}
.tile .front{background:var(--surface2);justify-content:center;align-items:flex-start}
.tile .front b{font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;line-height:1}
.tile .front .tap{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-top:auto}
.tile .back{background:var(--surface);transform:rotateY(180deg);font-size:.93rem}
.tile .back b{font-size:1rem}
.tile .bignum{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:.9;color:var(--accent)}

/* 預測／小測選項 */
.predict{border:2px dashed var(--accent);border-radius:14px;padding:14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px}
.predict .ptag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;font-weight:700}
.predict .pq{font-weight:700;font-size:1.04rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px;display:flex;gap:10px;align-items:center;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);flex:none;width:18px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--signal);background:var(--signal-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.93rem;animation:sceneIn .25s}
.fb.ok{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.bad{background:var(--signal-soft);border:1px solid color-mix(in srgb,var(--signal) 40%,transparent)}
.fb .h{font-weight:700}
.fb .lnk{border-top:1px dashed color-mix(in srgb,var(--ink) 25%,transparent);padding-top:6px}
.fb .lnk b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:popIn .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes popIn{from{transform:scale(.85)}to{transform:scale(1)}}

/* 分類箱 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipx{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;min-height:42px;text-align:left}
.chipx.sel{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:96px;cursor:pointer;background:var(--surface2);display:flex;flex-direction:column;gap:6px;text-align:left}
.bin.armed{border-color:var(--accent)}
.bin h4{margin:0;font-family:var(--f-display);font-size:1.15rem;text-transform:uppercase}
.bin .placed{font-size:.86rem;background:var(--ok-soft);border-radius:8px;padding:5px 8px}

/* 配對 */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mitem{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;cursor:pointer;text-align:left;font-size:.9rem;min-height:52px;transition:all .15s;overflow-wrap:anywhere}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.done{border-color:var(--ok);background:var(--ok-soft);opacity:.75;cursor:default}
.mitem.flash{border-color:var(--brass);background:var(--brass-soft)}
.mitem .yr{font-family:var(--f-display);font-weight:800;font-size:1.35rem}

/* 股災模擬 */
.crash{position:relative;border-radius:14px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.crash svg{display:block;width:100%;height:auto}
.crash .stampbox{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.crash .stamp{font-size:clamp(1.1rem,4.5vw,1.8rem);background:color-mix(in srgb,var(--surface) 80%,transparent)}
.investors{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.inv{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-family:var(--f-mono);font-size:.68rem;font-weight:700;transition:all .2s}
.inv.panic{border-color:var(--signal);color:var(--signal);animation:wob .5s infinite}
.inv.sold{background:var(--signal);color:var(--surface);border-color:var(--signal);animation:none}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.05)}}

/* 骨牌 */
.dominoes{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:120px;padding-top:10px;overflow:hidden}
.dom{width:30px;height:96px;border-radius:5px;background:var(--ink);transform-origin:bottom right;transition:transform .35s cubic-bezier(.5,0,.8,.4);display:grid;place-items:center;color:var(--bg);font-family:var(--f-mono);font-size:.75rem;font-weight:700;flex:none}
.dom.fall{transform:rotate(68deg);background:var(--signal)}
.domlist{display:grid;gap:8px;counter-reset:d}
.domlist li{list-style:none;border-radius:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);opacity:.35;transition:opacity .3s,background .3s}
.domlist li.on{opacity:1;background:var(--surface)}
.domlist li b{font-family:var(--f-mono);font-size:.75rem;color:var(--signal);margin-right:6px}

/* 樓梯 */
.stairs{display:flex;flex-direction:column-reverse;gap:6px}
.stair{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border-radius:10px;padding:8px 10px;border:1px solid var(--line);background:var(--surface2);opacity:.32;transition:all .3s}
.stair.on{opacity:1;background:var(--surface)}
.stair.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stair .yr{font-family:var(--f-display);font-weight:800;font-size:1.25rem;min-width:52px;text-align:center;color:var(--de)}

/* 拔河 */
.tug{position:relative;height:84px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.tug .rope{position:absolute;left:8%;right:8%;top:50%;height:6px;margin-top:-3px;background:repeating-linear-gradient(90deg,var(--brass) 0 10px,color-mix(in srgb,var(--brass) 60%,var(--surface)) 10px 20px);border-radius:4px}
.tug .knot{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--signal);border:3px solid var(--surface);transition:left .6s cubic-bezier(.3,1.4,.5,1);left:42%}
.tug .side{position:absolute;top:8px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1rem}
.tug .side.l{left:10px;color:var(--bf)}
.tug .side.r{right:10px;color:var(--jp)}
.tug .mid{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--line)}

/* 計量表 */
.meter{display:flex;gap:14px;align-items:stretch}
.meter .tube{width:40px;flex:none;border-radius:20px;border:2px solid var(--line);background:var(--surface2);position:relative;overflow:hidden;min-height:220px}
.meter .tube i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(var(--signal),color-mix(in srgb,var(--signal) 60%,var(--brass)));transition:height .5s}
.meter .cards{display:grid;gap:8px;flex:1;min-width:0}

/* 年份拖桿 */
.scrub{display:flex;flex-direction:column;gap:12px}
.scrub .yearbig{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:.9}
.scrub input[type=range]{width:100%;accent-color:var(--signal);height:28px}
.lanes{display:grid;gap:8px}
.lane{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:start}
.lane .ln{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.05rem;padding-top:6px}
.lane .evs{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;border-left:3px solid var(--line);padding-left:8px}
.evchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:.8rem;cursor:pointer;text-align:left;animation:popIn .3s}
.evchip.now{border-color:var(--signal);box-shadow:0 0 0 2px var(--signal-soft)}
.evchip .w{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);display:block}
@media (max-width:520px){.lane{grid-template-columns:1fr}.lane .evs{border-left:0;padding-left:0}}

/* 移動卡（德國六步、日本） */
.moves{display:grid;gap:10px}
.move{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);animation:sceneIn .35s}
.move .when{font-family:var(--f-display);font-weight:800;font-size:1.1rem;text-transform:uppercase;line-height:1;min-width:44px;max-width:92px}
.move .stamp{font-size:.72rem;margin-top:6px}

/* 軸心 SVG */
.axisbox svg{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.axisbox .yrbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.yrbtn{font-family:var(--f-display);font-weight:800;font-size:1.3rem;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;cursor:pointer;min-height:44px}
.yrbtn.done{border-color:var(--ok);color:var(--ok)}
.yrbtn.next{border-color:var(--accent)}

/* 國聯 */
.dotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16px,1fr));gap:5px;max-width:420px}
.dotgrid i{aspect-ratio:1;border-radius:50%;background:var(--line);transform:scale(.3);transition:transform .2s,background .2s}
.dotgrid i.on{background:var(--lon);transform:scale(1)}
.counter{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--lon)}
.shield svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.shield .crack{cursor:pointer}
.chartbox{overflow-x:auto}
.chartbox svg{min-width:290px;max-width:560px;width:100%;height:auto;display:block}
.casefiles{display:grid;gap:10px}
.folder{border-radius:4px 14px 14px 14px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.folder > button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;box-sizing:border-box;background:var(--brass-soft)}
.folder > button:focus-visible{outline:3px solid var(--accent)}
.folder h4{margin:0;font-family:var(--f-display);font-size:1.3rem;text-transform:uppercase;flex:1}
.folder .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}

/* 天秤 */
.scale svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.scale .beam{transition:transform .6s cubic-bezier(.3,1.5,.5,1);transform-origin:220px 70px}

/* 概念圖 */
.cmap svg{width:100%;height:auto;display:block}
.cmap .arrow{cursor:pointer}
.cmap .arrow:hover path,.cmap .arrow.on path{stroke:var(--signal)}

/* ===== 測驗區 ===== */
.qtools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:26px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch input:checked{background:var(--signal)}
.switch input:checked::after{left:23px}
.topicchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.topicchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.82rem;white-space:nowrap}
.topicchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mode{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .12s,border-color .15s;min-height:132px}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode .mi{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.mode h3{font-family:var(--f-display);font-weight:800;font-size:1.55rem;text-transform:uppercase;line-height:1}
.mode p{font-size:.86rem;color:var(--muted)}
.mode.hot{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.hot p,.mode.hot .mi,.mode.hot .zh{color:color-mix(in srgb,var(--bg) 70%,transparent)}

/* 閃卡 */
.flash{perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:left;display:block}
.flash .in{display:grid;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.open .in{transform:rotateY(180deg)}
.flash .face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:10px;background:var(--surface);box-shadow:var(--shadow);overflow:auto}
.flash .back{transform:rotateY(180deg)}
.flash .qtxt{font-size:1.25rem;font-weight:700;line-height:1.35}
.flash .atxt{font-size:1.05rem;white-space:pre-line}
.flash .meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.flash .tapnote{margin-top:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:0;line-height:1.2}
.rate .btn.g{border-color:var(--ok);color:var(--ok)}
.rate .btn.f{border-color:var(--brass);color:var(--brass)}
.rate .btn.b{border-color:var(--signal);color:var(--signal)}

/* 時間線排序 */
.sortlist{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.sitem{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 8px 8px 4px;touch-action:none;user-select:none;-webkit-user-select:none}
.sitem .grip{width:34px;height:40px;display:grid;place-items:center;cursor:grab;color:var(--muted);flex:none;touch-action:none}
.sitem .txt{flex:1;min-width:0;font-size:.95rem}
.sitem .when{font-family:var(--f-display);font-weight:800;font-size:1.05rem;display:block}
.sitem .arr{display:flex;flex-direction:column;gap:2px}
.sitem .arr button{width:30px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);cursor:pointer;font-size:.7rem;padding:0;line-height:1}
.sitem.drag{opacity:.35}
.sitem.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:.95}
.sitem.right{border-color:var(--ok);background:var(--ok-soft)}
.sitem.wrong{border-color:var(--signal);background:var(--signal-soft)}
.axislabel{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}

/* 因果鏈 */
.chain{display:flex;flex-direction:column;align-items:stretch}
.link{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:.95rem}
.link.blank{border:2px dashed var(--accent);background:var(--accent-soft)}
.link.blank.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.link.blank.bad{border-style:solid;border-color:var(--signal);background:var(--signal-soft)}
.link input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface);color:var(--ink);margin-top:6px}
.chain .arrow{align-self:center;height:22px;width:2px;background:var(--muted);position:relative;margin:2px 0 6px}
.chain .arrow::after{content:"";position:absolute;left:-5px;bottom:-6px;border:6px solid transparent;border-top-color:var(--muted)}

/* 限時 */
.timer{display:flex;align-items:center;gap:14px}
.ring{width:72px;height:72px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--signal);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.ring text{font-family:var(--f-display);font-weight:800;font-size:22px;fill:var(--ink)}
.score{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.combo{font-family:var(--f-mono);font-size:.8rem;color:var(--brass);font-weight:700}

/* 進度 */
.mbar{display:flex;height:12px;border-radius:12px;overflow:hidden;background:var(--line)}
.mbar i{display:block;height:100%}
.mbar .m{background:var(--ok)}.mbar .l{background:var(--accent)}.mbar .w{background:var(--signal)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .mbar{grid-column:1/-1}
.trow .pct{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.wlist{display:grid;gap:8px}
.witem{border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:.9rem}

/* 提示訊息 & 彩紙 */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:55;width:100%;height:100%}
.xpfloat{position:fixed;z-index:58;pointer-events:none;font-family:var(--f-display);font-weight:800;color:var(--brass);font-size:1.3rem;animation:floatUp .9s ease-out forwards}
@keyframes floatUp{to{transform:translateY(-46px);opacity:0}}
.confirmbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--signal-soft);border-radius:10px;padding:10px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <button class="brand" id="brand" type="button" aria-label="Back to the route map">
      <b>Road to <span>WWII</span></b>
      <small>第二次世界大戰的成因 · The Causes of World War II</small>
    </button>
    <div class="xp" title="Your XP">
      <span class="medal" id="xpLv">1</span>
      <span class="rank" id="xpRank">Rookie</span>
      <span class="bar"><i id="xpBar"></i></span>
      <span class="mono" id="xpNum">0 XP</span>
    </div>
    <button class="iconbtn" id="zhBtn" type="button" aria-pressed="true" title="Chinese hints on/off 中文提示">中</button>
    <button class="iconbtn" id="sndBtn" type="button" aria-pressed="true" title="Sound on/off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>
</header>
<main>
  <div class="wrap">
    <nav class="zones" role="tablist" aria-label="Zones">
      <button role="tab" type="button" data-zone="review" aria-selected="true">Review<span class="zh">溫習區</span></button>
      <button role="tab" type="button" data-zone="quiz" aria-selected="false">Quiz<span class="zh">測驗區</span></button>
      <button role="tab" type="button" data-zone="progress" aria-selected="false">Progress<span class="zh">進度</span></button>
    </nav>
    <div id="view"></div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
/* =====================================================================
   核心：工具函數、儲存、記憶統計（間隔重複）、音效、彩紙、XP、選擇題
   ===================================================================== */
"use strict";

/* ---------- 小工具 ---------- */
const $ = (s, el = document) => el.querySelector(s);
// h()：建立 DOM 元素。attrs 支援 class / text / html / on事件 / style 物件
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
// 中文輔助文字（可用「中」掣隱藏）
const zh = (t, block) => t ? h("span", { class: "zh" + (block ? " zhb" : "") }, t) : null;
// 英文段落＋中文輔助
const P = (en, z, cls) => h("p", { class: cls || null }, en, z ? [" ", zh(z, true)] : null);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const yearOf = d => Math.floor(d + 1e-9);
// append 時自動略過 null / false（方便寫「條件 ? 元素 : null」）
const _append = Element.prototype.append;
Element.prototype.append = function (...k) { return _append.apply(this, k.filter(x => x != null && x !== false)); };

/* ---------- 儲存（localStorage，失敗都唔影響使用）---------- */
const STORE_KEY = "road-to-wwii-v1";
const DEFAULT_STATE = { stats: {}, xp: 0, ch: {}, best: 0, zh: true, snd: true, onlyWrong: false, topic: "all", zone: "review", badges: {} };
let S = (() => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { saved = null; }
  return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), saved || {});
})();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* 私密瀏覽等情況：只係唔儲存 */ } }

/* ---------- 題庫索引 ---------- */
const FACTS = DATA.filter(d => !d.type);
const CHAINS = DATA.filter(d => d.type === "chain");
const BY = Object.fromEntries(DATA.map(d => [d.id, d]));
const EVENTS = FACTS.filter(f => f.ev && f.d);
const PAIRS = [];
FACTS.forEach(f => (f.pr || []).forEach(p => PAIRS.push({ id: f.id, kind: p[0], l: p[1], r: p[2], g: p[3] || p[1], f })));
const CHAIN_ITEMS = [];
CHAINS.forEach(c => c.steps.forEach((s, i) => CHAIN_ITEMS.push({ id: c.id + ":" + i, t: c.t, chain: c, i })));
// 所有計入「掌握程度」的項目
const ALL_ITEMS = [...FACTS.map(f => ({ id: f.id, t: f.t })), ...CHAIN_ITEMS.map(c => ({ id: c.id, t: c.t }))];

/* ---------- 記憶統計：答錯多出、答對多次少出 ----------
   每題記錄 lv（0–5 級）：答對 +1，模糊最多 1 級，答錯回到 0。
   miss = 錯題標記；之後連續答對 2 次先會移除。 */
function record(id, res) { // res: "good" | "fuzzy" | "bad"
  const x = S.stats[id] || (S.stats[id] = { s: 0, c: 0, w: 0, lv: 0, last: 0 });
  x.s++; x.last = Date.now();
  if (res === "good") {
    x.c++; x.lv = Math.min(5, x.lv + 1);
    if (x.miss) { x.fix = (x.fix || 0) + 1; if (x.fix >= 2) { x.miss = false; x.fix = 0; } }
  } else {
    if (res === "bad") { x.w++; x.lv = 0; } else { x.lv = Math.min(x.lv, 1); }
    x.miss = true; x.fix = 0;
  }
  save();
}
const isMiss = id => !!(S.stats[id] && S.stats[id].miss);
function status(id) {
  const x = S.stats[id];
  if (!x || !x.s) return "new";
  if (x.miss) return "weak";
  return x.lv >= 3 ? "mastered" : "learning";
}
// 抽題權重：未做過 5；等級越低越常出；錯題 ×2；啱啱做完嘅暫時少出
function weight(id) {
  const x = S.stats[id];
  if (!x || !x.s) return 5;
  let w = [7, 4.5, 2.5, 1.2, 0.6, 0.3][x.lv] || 0.3;
  if (x.miss) w *= 2;
  if (Date.now() - x.last < 90000) w *= 0.15;
  return w;
}
function wpick(list, idOf = x => x.id) {
  let tot = 0; const ws = list.map(x => { const w = weight(idOf(x)); tot += w; return w; });
  let r = Math.random() * tot;
  for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}
// 按權重抽 n 個（不重複），ok() 用嚟檢查同已選嘅有冇衝突
function wsample(list, n, idOf = x => x.id, ok) {
  const pool = [...list], out = [];
  while (out.length < n && pool.length) {
    const c = wpick(pool, idOf);
    pool.splice(pool.indexOf(c), 1);
    if (!ok || ok(out, c)) out.push(c);
  }
  return out;
}
// 測驗區範圍：主題篩選＋只練錯題
function inScope(id, t) {
  if (S.topic !== "all" && t !== S.topic) return false;
  if (S.onlyWrong && !isMiss(id)) return false;
  return true;
}

/* ---------- 日期：判斷兩件事能否分先後 ----------
   只有年份的事件當作覆蓋全年；有月份就係該月；有 d2 就係一段時間 */
function span(e) {
  const y = yearOf(e.d), m = Math.round((e.d - y) * 100);
  const s = m ? e.d : y + 0.001;
  const end = e.d2 ? e.d2 : (m ? e.d : y + 0.12);
  return [s, end];
}
function orderable(a, b) { const A = span(a), B = span(b); return A[1] < B[0] || B[1] < A[0]; }

/* ---------- 音效（Web Audio，即時合成，唔使檔案）---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, at, dur, type = "sine", vol = 0.07) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  ok() { tone(660, 0, 0.1); tone(990, 0.08, 0.16); },
  bad() { tone(220, 0, 0.18, "triangle", 0.09); tone(160, 0.1, 0.22, "triangle", 0.07); },
  flip() { tone(430, 0, 0.06, "triangle", 0.05); },
  tick() { tone(1200, 0, 0.03, "square", 0.025); },
  thud() { tone(120, 0, 0.16, "sawtooth", 0.05); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.22)); },
  crash() { [400, 330, 260, 190, 130].forEach((f, i) => tone(f, i * 0.07, 0.16, "sawtooth", 0.05)); }
};
function play(name) { if (S.snd) try { SFX[name](); } catch (e) { } }

/* ---------- 彩紙 ---------- */
const FX = { cv: null, ctx: null, parts: [], raf: 0 };
function confetti(n = 70) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (!FX.cv) { FX.cv = $("#fx"); FX.ctx = FX.cv.getContext("2d"); }
  const W = FX.cv.width = innerWidth, H = FX.cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--signal", "--accent", "--brass", "--ok"].map(v => cs.getPropertyValue(v).trim());
  for (let i = 0; i < n; i++) FX.parts.push({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 4, r: Math.random() * 6 + 4, c: cols[i % 4], a: Math.random() * 6, life: 0 });
  if (!FX.raf) loop();
  function loop() {
    FX.ctx.clearRect(0, 0, W, H);
    FX.parts = FX.parts.filter(p => p.life < 90);
    for (const p of FX.parts) {
      p.life++; p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.a += 0.2;
      FX.ctx.save(); FX.ctx.translate(p.x, p.y); FX.ctx.rotate(p.a); FX.ctx.fillStyle = p.c;
      FX.ctx.globalAlpha = Math.max(0, 1 - p.life / 90); FX.ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); FX.ctx.restore();
    }
    FX.raf = FX.parts.length ? requestAnimationFrame(loop) : (FX.ctx.clearRect(0, 0, W, H), 0);
  }
}

/* ---------- 提示訊息 ---------- */
let toastT = 0;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- XP 與等級 ---------- */
const RANKS = [[0, "Rookie", "新手"], [100, "Cadet", "見習生"], [250, "Researcher", "研究員"], [500, "Historian", "歷史學家"], [900, "Professor", "教授"], [1400, "Exam Ace", "考試王"]];
function rankOf(xp) { let i = 0; RANKS.forEach((r, k) => { if (xp >= r[0]) i = k; }); return i; }
function renderXP() {
  const i = rankOf(S.xp), cur = RANKS[i], nxt = RANKS[i + 1];
  $("#xpLv").textContent = i + 1;
  $("#xpRank").textContent = cur[1];
  $("#xpNum").textContent = S.xp + " XP";
  $("#xpBar").style.width = nxt ? Math.round((S.xp - cur[0]) / (nxt[0] - cur[0]) * 100) + "%" : "100%";
}
function addXP(n, from) {
  const before = rankOf(S.xp);
  S.xp += n; save(); renderXP();
  if (from && from.getBoundingClientRect) {
    const r = from.getBoundingClientRect();
    const f = h("div", { class: "xpfloat", style: { left: (r.left + r.width / 2 - 20) + "px", top: (r.top - 6) + "px" } }, "+" + n);
    document.body.append(f); setTimeout(() => f.remove(), 950);
  }
  const after = rankOf(S.xp);
  if (after > before) { play("win"); confetti(90); toast(`Rank up! ${RANKS[after][1]} ${RANKS[after][2]}`); }
}

/* ---------- 徽章 ---------- */
const BADGES = [
  { id: "first", n: "1", en: "First stamp", z: "完成第一站" },
  { id: "half", n: "5", en: "Halfway", z: "完成五站" },
  { id: "all", n: "★", en: "Route complete", z: "走完全程" },
  { id: "perfect", n: "3", en: "Perfect checkpoint", z: "小測三星" },
  { id: "ready", n: "A", en: "Exam ready", z: "最終任務 8 分或以上" },
  { id: "speed", n: "60", en: "Speed reader", z: "限時挑戰 15 分" },
  { id: "order", n: "↕", en: "Time keeper", z: "時間線全對" },
  { id: "matcher", n: "⇄", en: "Perfect match", z: "配對零失誤" }
];
function award(id) {
  if (S.badges[id]) return;
  S.badges[id] = Date.now(); save();
  const b = BADGES.find(x => x.id === id);
  if (b) { setTimeout(() => { toast(`Badge: ${b.en} ${b.z}`); play("win"); confetti(60); }, 500); }
}

/* ---------- 回饋框：答錯顯示答案＋中文＋聯繫 ---------- */
function feedback(ok, f, opts = {}) {
  const box = h("div", { class: "fb " + (ok ? "ok" : "bad") });
  box.append(h("div", { class: "h" }, ok ? (opts.okText || "Correct!") : (opts.badText || "Not quite."), " ", zh(ok ? "答對了" : "答錯了")));
  if (f) {
    if (!ok || opts.showAnswer) box.append(h("div", { style: { whiteSpace: "pre-line" } }, h("b", null, "Answer: "), f.a));
    if (f.zh) box.append(zh(f.zh, true));
    if (!ok && f.link) box.append(h("div", { class: "lnk" }, h("b", null, "Link it 記憶線索"), h("div", null, f.link)));
    if (f.warn) box.append(h("div", { class: "warn" }, f.warn));
  }
  return box;
}

/* ---------- 選擇題生成 ---------- */
// 由知識點產生選擇題：kind = mc（自帶選項）| when（幾時發生）| what（發生咩事）
function mcqFrom(f, kind) {
  if (!kind) {
    const ks = [];
    if (f.mc) ks.push("mc");
    if (f.ev) ks.push("when", "what");
    if (!ks.length) return null;
    kind = ks[Math.random() * ks.length | 0];
  }
  if (kind === "mc" && f.mc) return { id: f.id, q: f.mq || f.q, opts: shuffle(f.mc.map((t, i) => ({ t, ok: i === 0 }))), f };
  if (kind === "when" && f.ev) {
    const labels = [];
    for (const e of shuffle(EVENTS)) {
      if (e.when === f.when || !orderable(e, f) || labels.includes(e.when)) continue;
      labels.push(e.when); if (labels.length === 3) break;
    }

function checkpointScene(ch, n, title, z) {
  return {
    t: title || "Checkpoint", z: z || "站末小測", run(el, done) {
      const pool = ch.check === "all" ? FACTS.filter(f => f.mc || f.ev) : ch.check.map(id => BY[id]);
      const N = n || 5;
      let qs, k, score;
      const prog = h("span", { class: "eyebrow" });
      const box = h("div", { class: "stack" });
      el.append(P(ch.check === "all" ? "10 questions from every stop. Score 8 or more to earn the “Exam ready” badge." : "Quick questions on this stop. Every answer updates your mastery.", ch.check === "all" ? "從全部站點抽 10 題，答對 8 題或以上可得「Exam ready」徽章。" : "本站小測，答題結果會更新掌握程度。", "note"), prog, box);
      function start() { qs = wsample(pool, Math.min(N, pool.length)); k = 0; score = 0; ask(); }
      function ask() {
        prog.textContent = `Question ${k + 1} of ${qs.length}`;
        box.innerHTML = "";
        box.append(mcqWidget(mcqFrom(qs[k]), (ok, b) => {
          if (ok) { score++; addXP(10, b); }
          const nb = h("button", { class: "btn primary", type: "button" }, k + 1 < qs.length ? "Next question →" : "See my result");
          nb.onclick = () => { k++; k < qs.length ? ask() : finish(); };
          box.append(h("div", { class: "row end" }, nb));
        }));
      }
      function finish() {
        const r = score / qs.length;
        const stars = r >= 0.9 ? 3 : r >= 0.7 ? 2 : r >= 0.4 ? 1 : 0;
        const st = S.ch[ch.id];
        st.stars = Math.max(st.stars || 0, stars); save();
        prog.textContent = "Result";
        box.innerHTML = "";
        box.append(h("div", { class: "card stack", style: { textAlign: "center", alignItems: "center" } },
          h("div", { class: "h-display", style: { fontSize: "3.4rem" } }, `${score}/${qs.length}`),
          h("div", { class: "stars", style: { fontSize: "1.8rem" } }, [0, 1, 2].map(i => h("span", { class: i < stars ? "on" : "" }, "★"))),
          P(stars === 3 ? "Excellent! You know this stop well." : stars >= 1 ? "Good work. Your mistakes go to the Mistake book for extra practice." : "Keep going – the questions you missed will come back more often.",
            stars === 3 ? "非常好！" : stars >= 1 ? "做得好，錯題已加入錯題本。" : "繼續努力，答錯的題目會更常出現。"),
          h("div", { class: "row", style: { justifyContent: "center" } }, h("button", { class: "btn", type: "button", onclick: () => start() }, "Try again ", zh("再試")))));
        if (stars === 3) { award("perfect"); confetti(80); play("win"); }
        if (ch.check === "all" && score >= 8) award("ready");
        done();
      }
      start();
    }
  };
}

function openChapter(cid, idx) {
  const ch = CHAPTERS.find(c => c.id === cid);
  const st = chState(cid);
  const scenes = ch.allScenes;
  idx = Math.max(0, Math.min(idx || 0, scenes.length - 1));
  st.seen = Math.max(st.seen || 0, idx); save();
  const v = clearView();
  const sc = scenes[idx];
  const isLast = idx === scenes.length - 1;
  const nextBtn = h("button", { class: "btn primary", type: "button" }, isLast ? "Finish this stop ✓" : "Next →");
  const backBtn = h("button", { class: "btn ghost", type: "button" }, idx ? "← Back" : "← Map");
  backBtn.onclick = () => idx ? openChapter(cid, idx - 1) : setZone("review");
  nextBtn.onclick = () => {
    if (!isLast) return openChapter(cid, idx + 1);
    finishChapter(ch);
  };
  // 本頁完成：Next 發光＋第一次完成加 XP
  const done = () => {
    nextBtn.classList.add("pulse");
    const key = String(idx);
    if (!st.sd.includes(key)) { st.sd.push(key); save(); addXP(5, nextBtn); }
  };
  const body = h("div", { class: "stack lg" });
  v.append(
    h("div", { class: "chap-head" },
      h("button", { class: "iconbtn", type: "button", "aria-label": "Back to the route map", onclick: () => setZone("review") }, "←"),
      h("div", { class: "t" }, h("div", { class: "eyebrow" }, `${ch.stop} · ${ch.title}`), h("div", { class: "dots", "aria-label": `Page ${idx + 1} of ${scenes.length}` }, scenes.map((_, i) => h("i", { class: i === idx ? "cur" : i <= st.seen ? "seen" : "" }))))),
    h("section", { class: "card scene" },
      h("div", { class: "stack lg" }, h("div", null, h("div", { class: "eyebrow" }, `Page ${idx + 1} of ${scenes.length}`), h("h3", { class: "st" }, sc.t), zh(sc.z, true)), body)),
    h("div", { class: "scene-foot" }, backBtn, nextBtn));
  sc.run(body, done);
}
function finishChapter(ch) {
  const st = chState(ch.id);
  const first = !st.done;
  st.done = true; save();
  if (first) {
    addXP(20);
    play("win"); confetti(100);
    const n = CHAPTERS.filter(c => S.ch[c.id] && S.ch[c.id].done).length;
    award("first"); if (n >= 5) award("half"); if (n === CHAPTERS.length) award("all");
    toast(`Stamp collected: ${ch.title} ✓`);
  }
  setZone("review");
}

// 拖曳排序（滑鼠／觸控都用 Pointer Events）
function makeSortable(ul) {
  ul.addEventListener("pointerdown", e => {
    if (ul._locked) return;
    const li = e.target.closest(".sitem"); if (!li) return;
    const onGrip = e.target.closest(".grip");
    if (!onGrip && (e.pointerType !== "mouse" || e.target.closest("button"))) return;
    e.preventDefault();
    const r = li.getBoundingClientRect();
    const ghost = li.cloneNode(true);
    ghost.classList.add("ghost");
    Object.assign(ghost.style, { width: r.width + "px", left: r.left + "px", top: r.top + "px" });
    document.body.append(ghost);
    const offY = e.clientY - r.top;
    li.classList.add("drag");
    const pid = e.pointerId;
    let scrollDir = 0;
    const scroller = setInterval(() => { if (scrollDir) window.scrollBy(0, scrollDir * 10); }, 16);
    const move = ev => {
      if (ev.pointerId !== pid) return;
      ghost.style.top = (ev.clientY - offY) + "px";
      let before = null;
      for (const it of ul.children) {
        if (it === li) continue;
        const rr = it.getBoundingClientRect();
        if (ev.clientY < rr.top + rr.height / 2) { before = it; break; }
      }
      if (before) { if (li.nextElementSibling !== before) ul.insertBefore(li, before); }
      else if (ul.lastElementChild !== li) ul.append(li);
      scrollDir = ev.clientY < 80 ? -1 : ev.clientY > innerHeight - 80 ? 1 : 0;
    };
    // 用 window 監聽：卡片喺 DOM 移動時 pointer capture 會失效
    const up = ev => {
      if (ev.pointerId !== pid) return;
      clearInterval(scroller);
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
      ghost.remove(); li.classList.remove("drag"); play("tick");
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  });
}

// 因果鏈排序用：拿走句子入面的年份（否則一眼就知次序）
function stripDates(t) {
  const M = "(?:January|February|March|April|May|June|July|August|September|October|November|December)";
  let x = t.replace(/\s*\(\d{4}\)/g, "")
    .replace(new RegExp("(?:Late |Early )?(?:" + M + " )?\\d{4}\\s*:\\s*", "g"), "")
    .replace(/\b\d{4}\s+(?=[a-z])/g, "")
    .replace(/\s{2,}/g, " ").trim();
  return x.charAt(0).toUpperCase() + x.slice(1);
}

      const c = BY[x.id]; let best = c.id + ":0", bw = -1;
      c.steps.forEach((_, i) => { const w = weight(c.id + ":" + i); if (w > bw) { bw = w; best = c.id + ":" + i; } });
      return best;
    }).id;
    lastChain = cid;
    const chain = BY[cid];
    const blanks = sc.list.filter(x => x.chain.id === cid);
    const blank = wpick(blanks);
    const i0 = blank.i, step = chain.steps[i0];
    const box = h("div", { class: "chain" });
    const input = h("input", { type: "text", id: "chain-answer", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "Type the missing link…", "aria-label": "Missing link" });
    const blankEl = h("div", { class: "link blank" }, h("div", { class: "eyebrow" }, "Missing link 缺少的一環"), input);
    chain.steps.forEach((st, i) => {

      box.append(i === i0 ? blankEl : h("div", { class: "link" }, st.s, zh(st.z, true)));

    const out = h("div", { class: "stack" });
    const bCheck = h("button", { class: "btn primary", type: "button" }, "Check ", zh("核對"));
    const bHint = h("button", { class: "btn", type: "button" }, "Hint ", zh("提示"));
    const bShow = h("button", { class: "btn ghost", type: "button" }, "Show answer ", zh("看答案"));

    let hinted = false, finished = false;

      out.prepend(h("div", { class: "note" }, "Hint (Chinese): ", h("span", { style: { fontFamily: "var(--f-zh)" } }, step.z), " · starts with “", step.s.split(" ")[0].replace(/[:,]/g, ""), "”"));
    };

    const nextBtn = () => h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: round }, "Next chain →"));

          h("div", { class: "lnk" }, h("b", null, "Link it 記憶線索"), h("div", null, `This is step ${i0 + 1} of “${chain.title}” (p.${chain.p}).`))),
          h("div", { class: "row" },

            h("button", { class: "btn primary", type: "button", onclick: () => { decide("bad"); round(); } }, "Next chain →")));
      }
    };
    bShow.onclick = () => {

        h("div", { class: "rate" },
          h("button", { class: "btn g", type: "button", onclick: () => { record(blank.id, "good"); round(); } }, "Knew it", zh("記得")),
          h("button", { class: "btn f", type: "button", onclick: () => { record(blank.id, "fuzzy"); round(); } }, "Fuzzy", zh("模糊")),
          h("button", { class: "btn b", type: "button", onclick: () => { record(blank.id, "bad"); round(); } }, "Forgot", zh("忘了"))));
    };
    input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); bCheck.click(); } });
    holder.append(sc.note ? h("div", { class: "note" }, sc.note) : null,
      h("div", null, h("div", { class: "eyebrow" }, `${TOPICS[chain.t].en} · p.${chain.p}`), h("h3", { class: "st h-display", style: { fontSize: "1.7rem" } }, chain.title), zh(chain.zh, true)),
      box, ctl, out);

}

/* =====================================================================
   5. 60 秒限時挑戰
   ===================================================================== */
function timedPool() {
  const q = [];
  FACTS.forEach(f => {
    if (!inScope(f.id, f.t)) return;
    if (f.mc) q.push({ id: f.id, make: () => mcqFrom(f, "mc") });
    if (f.ev) { q.push({ id: f.id, make: () => mcqFrom(f, "when") }); q.push({ id: f.id, make: () => mcqFrom(f, "what") }); }
  });
  PAIRS.filter(p => p.kind === "term" || p.kind === "cause").forEach(p => { if (inScope(p.id, p.f.t)) q.push({ id: p.id, make: () => mcqFromPair(p) }); });
  return q;
}
function modeTimed(m) {
  const v = clearView();
  const holder = h("div", { class: "stack lg" });
  v.append(modeHead(m), quizTools(() => modeTimed(m)), holder);
  let pool = timedPool(), note = null;
  if (pool.length < 6) { const keep = S.onlyWrong; S.onlyWrong = false; pool = timedPool(); S.onlyWrong = keep; note = "Not enough mistakes yet – using all questions in this topic. 錯題不足，改用此主題全部題目。"; }
  if (pool.length < 6) { const t = S.topic; S.topic = "all"; pool = timedPool(); S.topic = t; note = "Using questions from all topics. 使用全部主題的題目。"; }
  holder.append(h("div", { class: "card stack", style: { textAlign: "center", alignItems: "center" } },
    h("div", { class: "eyebrow" }, "Best score 最高紀錄"),
    h("div", { class: "h-display", style: { fontSize: "4rem", color: "var(--signal)" } }, S.best),
    P("60 seconds. Tap the right answer as fast as you can. Wrong answers show the correct one and go to your Mistake book.", "60 秒內盡快選出正確答案；答錯會顯示正確答案並加入錯題本。"),
    note ? h("div", { class: "note" }, note) : null,
    h("button", { class: "btn primary big", type: "button", onclick: start }, "Start ", zh("開始"))));

  function start() {
    holder.innerHTML = "";
    const total = 60, C = 2 * Math.PI * 30;
    let left = total, score = 0, streak = 0, ended = false;
    const wrongs = [];
    const fg = s("circle", { class: "fg", cx: 36, cy: 36, r: 30, "stroke-dasharray": C, "stroke-dashoffset": 0 });
    const tnum = s("text", { x: 36, y: 44, "text-anchor": "middle", text: String(total) });
    const ring = s("svg", { class: "ring", viewBox: "0 0 72 72", "aria-hidden": "true" }, s("circle", { class: "bg", cx: 36, cy: 36, r: 30 }), fg, tnum);
    const scoreEl = h("div", { class: "score" }, "0");
    const comboEl = h("div", { class: "combo" });
    const qbox = h("div", { class: "stack" });
    holder.append(h("div", { class: "timer card", style: { padding: "12px 16px" } }, ring, h("div", { style: { flex: 1 } }, h("div", { class: "eyebrow" }, "Score 分數"), scoreEl), comboEl), qbox);
    const timer = setInterval(() => {
      left--; tnum.textContent = String(left);
      fg.setAttribute("stroke-dashoffset", String(C * (1 - left / total)));
      if (left <= 5 && left > 0) play("tick");
      if (left <= 0) end();
    }, 1000);
    onLeave(() => clearInterval(timer));
    const recent = [];
    function ask() {
      if (ended) return;
      const cand = pool.filter(x => !recent.includes(x.id));
      const pick = wpick(cand.length ? cand : pool);
      recent.push(pick.id); if (recent.length > Math.min(8, pool.length - 1)) recent.shift();
      const item = pick.make();
      if (!item || item.opts.length < 2) return ask();
      qbox.innerHTML = "";
      qbox.append(mcqWidget(item, ok => {
        if (ended) return;
        if (ok) { score++; streak++; scoreEl.textContent = score; scoreEl.classList.remove("pop"); void scoreEl.offsetWidth; scoreEl.classList.add("pop"); }
        else { streak = 0; wrongs.push(item); }
        comboEl.textContent = streak >= 3 ? `Streak ×${streak}` : "";
        setTimeout(ask, ok ? 380 : 1100);
      }, { feedback: false }));
    }
    function end() {
      if (ended) return; ended = true; clearInterval(timer);
      const isBest = score > S.best;
      if (isBest) { S.best = score; save(); }
      addXP(score * 2);
      if (score >= 15) award("speed");
      play(isBest ? "win" : "ok"); if (isBest && score) confetti(100);
      holder.innerHTML = "";
      holder.append(h("div", { class: "card stack", style: { textAlign: "center", alignItems: "center" } },
        h("div", { class: "eyebrow" }, isBest ? "New best! 新紀錄！" : "Time's up! 時間到"),
        h("div", { class: "h-display", style: { fontSize: "4.4rem", color: "var(--signal)" } }, score),
        h("div", { class: "note" }, `Best: ${S.best}`),
        h("div", { class: "row", style: { justifyContent: "center" } },
          h("button", { class: "btn primary big", type: "button", onclick: start }, "Play again ", zh("再玩")),
          h("button", { class: "btn", type: "button", onclick: () => renderQuizHome() }, "Quiz zone"))));
      if (wrongs.length) {
        holder.append(h("div", { class: "card stack" }, h("div", { class: "eyebrow" }, `Review your ${wrongs.length} mistake(s) 檢討錯題`),
          wrongs.map(w => {
            const right = w.opts.find(o => o.ok).t;
            return h("div", { class: "witem stack", style: { gap: "4px" } }, h("b", null, w.q), w.sub ? h("div", { class: "note" }, w.sub) : null,
              h("div", null, "Answer: ", h("b", null, right)), zh(w.f && w.f.zh, true), w.f && w.f.link ? h("div", { class: "note" }, "Link: " + w.f.link) : null);
          })));
      }
    }
    ask();
  }
}
